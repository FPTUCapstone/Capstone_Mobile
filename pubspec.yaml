name: trip_mate_mobile
description: Mobile application for TripMate travelers and tour operators.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  connectivity_plus: ^7.0.0
  dio: ^5.9.2
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.0.0
  get_it: ^9.2.1
  go_router: ^17.1.0
  json_annotation: ^4.11.0
  shared_preferences: ^2.5.4

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.12.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true

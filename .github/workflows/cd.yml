name: CD

on:
  push:
    branches: [develop, main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Validate API_BASE_URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL GitHub Actions variable is required for demo APK builds."
            exit 1
          fi
          if ! echo "$API_BASE_URL" | grep -Eq '^https?://[^/[:space:]]+(/[^[:space:]]*)?$'; then
            echo "API_BASE_URL must be a valid HTTP or HTTPS URL with a non-empty host: $API_BASE_URL"
            exit 1
          fi

      # Debug build: no release keystore/signing secrets exist yet, so this produces an
      # installable-for-testing APK, not a Play Store-ready release build. Switch to
      # `flutter build apk --release` once real signing secrets are set up.
      - name: Build debug APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          flutter build apk --debug \
            --dart-define=APP_ENV=development \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tripmate-demo-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

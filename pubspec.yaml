name: trip_mate_mobile
description: Mobile application for TripMate travelers and tour operators.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  connectivity_plus: ^7.0.0
  dio: ^5.9.2
  equatable: ^2.0.8
  file_picker: ^11.0.3
  firebase_auth: ^6.1.0
  firebase_core: ^4.2.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.0.0
  get_it: ^9.2.1
  geolocator: ^14.0.2
  google_sign_in: ^7.2.0
  go_router: ^17.1.0
  json_annotation: ^4.11.0
  qr_flutter: ^4.1.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  uuid: ^4.5.1
  mobile_scanner: ^7.4.2
  mapbox_maps_flutter: ^3.0.0
  firebase_messaging: ^16.7.0
  url_launcher: ^6.3.1
  signalr_netcore: ^1.4.4

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.12.2
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/images/destinations/
    - assets/fonts/BricolageGrotesque_OFL.txt
    - assets/fonts/Manrope_OFL.txt
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

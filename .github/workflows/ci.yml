name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate API_BASE_URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL GitHub Actions variable is required for demo APK builds."
            exit 1
          fi
          dart run tool/validate_api_base_url.dart "$API_BASE_URL"

      # MAPBOX_ACCESS_TOKEN is the public (pk.) token for the UC-13 map, address search and
      # turn-by-turn guidance. It is optional: without it (e.g. pull requests from forks, which
      # get no secrets) the app falls back to the illustration map.
      - name: Build debug APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          flutter build apk --debug \
            --dart-define=APP_ENV=development \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tripmate-demo-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

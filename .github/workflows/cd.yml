name: CD

on:
  push:
    branches: [develop, main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Debug build: no release keystore/signing secrets exist yet, so this produces an
      # installable-for-testing APK, not a Play Store-ready release build. Switch to
      # `flutter build apk --release` once real signing secrets are set up.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tripmate-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
